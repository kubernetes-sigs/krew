name: Kubernetes-sigs/krew CI
on:
  push:
    branches:
      - '*'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - '*'

jobs:

  build:
    runs-on: ubuntu-latest
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27'
        check-latest: true
        cache: true
      id: go

    - name: Install dependencies
      run: go mod download

    - name: Build
      run: go build ./...

    - name: Verify cross-platform build
      run: |
        GOOS=darwin GOARCH=arm64 go build ./...
        GOOS=windows GOARCH=amd64 go build ./...

    - name: Install gox
      run: hack/install-gox.sh

    - name: Ensure go.mod is already tidied
      run: go mod tidy && git diff --no-patch --exit-code

    - name: Verify code patterns
      run: hack/verify-code-patterns.sh

    - name: Verify boilerplate
      run: hack/verify-boilerplate.sh

    - name: Run code lint
      run: hack/run-lint.sh

    - name: Run unit tests
      run: go test -short -race ./...

    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
        govulncheck ./...

    - name: Make binaries && verify krew installation
      run: hack/make-all.sh

    - name: Ensure kubectl installed
      run: hack/ensure-kubectl-installed.sh

    - name: Verify installation
      run: hack/verify-installation.sh

    - name: Run integration tests
      run: hack/run-integration-tests.sh

    - name: Verify index migration from 0.3.x to 0.4.x
      run: hack/verify-index-migration.sh

    - name: Make release notes
      if: contains(github.ref, 'tags')
      run: |
        echo 'RELEASE_NOTES<<EOF' >> $GITHUB_ENV
        TAG=$GITHUB_REF_NAME hack/make-release-notes.sh >> $GITHUB_ENV
        echo 'EOF' >> $GITHUB_ENV

    - name: Create a new release
      if: contains(github.ref, 'tags')
      id: create_release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        name: Release ${{ github.ref_name }}
        files: out/krew*
        body: ${{ env.RELEASE_NOTES }}
        fail_on_unmatched_files: true

  site-functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site/functions
    steps:

    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27'
        check-latest: true
        cache: true
        cache-dependency-path: site/functions/go.sum

    - name: Ensure go.mod is tidied
      run: go mod tidy && git diff --no-patch --exit-code

    - name: Build
      run: go build -o /dev/null ./...

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test ./...
